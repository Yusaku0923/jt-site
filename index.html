<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juggler Tracker</title>
<style>
  :root { --bg:#111418; --panel:#1a1f26; --text:#e8e6e0; --dim:#8a94a3; --accent:#e8b03c;
          --hi:#e05252; --mid:#e8b03c; --low:#3a4453; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font-family:"Hiragino Kaku Gothic ProN",system-ui,sans-serif; font-size:13px; }
  header { padding:12px 14px 8px; }
  h1 { font-size:16px; color:var(--accent); display:inline; }
  header .sub { color:var(--dim); font-size:11px; margin-top:4px; }
  nav { display:flex; gap:2px; padding:6px 8px 0; overflow-x:auto; border-bottom:1px solid #2a3038; }
  nav button { background:none; border:none; color:var(--dim); padding:8px 12px; cursor:pointer;
               font-size:13px; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.on { color:var(--text); border-color:var(--accent); }
  main { padding:12px 10px 60px; max-width:1000px; margin:auto; }
  .tw { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:6px 8px; text-align:right; border-bottom:1px solid #232a33; white-space:nowrap; }
  th { color:var(--dim); font-weight:normal; font-size:11px; }
  td:first-child, th:first-child, td.l, th.l { text-align:left; }
  tr.hi td { background:rgba(224,82,82,.13); }
  tr.mid td { background:rgba(232,176,60,.10); }
  .pill { display:inline-block; min-width:46px; text-align:center; padding:2px 7px; border-radius:10px; font-size:11px; }
  .pill.hi { background:var(--hi); color:#fff; } .pill.mid { background:var(--mid); color:#111; }
  .pill.low { background:var(--low); color:var(--dim); } .pill.na { color:var(--dim); }
  .note { color:var(--dim); margin:8px 2px; font-size:11px; line-height:1.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; margin-top:10px; }
  .card { background:var(--panel); border-radius:8px; padding:10px 12px; }
  .card h3 { font-size:12px; color:var(--dim); margin-bottom:8px; font-weight:normal; }
  .bar { height:7px; background:#2a3038; border-radius:4px; overflow:hidden; margin:3px 0 7px; }
  .bar i { display:block; height:100%; background:var(--accent); }
  svg { width:100%; height:100px; }
  .back { color:var(--accent); cursor:pointer; }
  #detail h2 { font-size:14px; margin:8px 0 10px; }
  h2.sec { font-size:13px; color:var(--accent); margin:18px 2px 6px; font-weight:normal; }
  h2.sec:first-child { margin-top:4px; }
  .hero { background:linear-gradient(135deg,#2a2013,#1a1f26); border:1px solid #3a3020;
          border-radius:8px; padding:12px 14px; }
  .hero .d { font-size:22px; color:var(--accent); }
  .hero .t { color:var(--dim); font-size:11px; margin-top:3px; line-height:1.6; }
  .warn { background:rgba(224,82,82,.12); border-left:3px solid var(--hi); border-radius:4px;
          padding:9px 11px; margin:10px 0; font-size:11px; line-height:1.6; color:#f0d6d6; }
  .warn b { color:#ff9b9b; }
  .kpi { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .kpi div { background:var(--panel); border-radius:6px; padding:7px 11px; flex:1; min-width:88px; }
  .kpi span { display:block; color:var(--dim); font-size:10px; }
  .kpi b { font-size:16px; font-weight:normal; }
  td.pos { color:#6ec86e; } td.neg { color:#c86e6e; }
  .kw { font-variant-numeric:tabular-nums; }
  .map { font-size:11px; line-height:1.9; }
  .map div { border-bottom:1px solid #232a33; padding:4px 0; }
  .map b { color:var(--text); font-weight:normal; }
  .map i { color:var(--dim); font-style:normal; }
  .tag { display:inline-block; background:#2a3038; color:var(--dim); border-radius:3px;
         padding:1px 5px; font-size:10px; margin-left:5px; }
  .tag.new { background:#2c4a2c; color:#9ede9e; }
</style>
</head>
<body>
<header>
  <h1>Juggler Tracker</h1>
  <div class="sub">ベルシティザシティ元住吉店 ｜ <span id="meta"></span></div>
</header>
<nav id="tabs"></nav>
<main id="main"></main>
<script>
const TABS = [["daily","日別 打てる機種"],["today","本日の候補"],["cross","機種横断"],["all","全台"],["trends","傾向"],["accuracy","的中率"]];
let cur = "daily", D = null;

function pill(p) {
  if (p == null) return `<span class="pill na">—</span>`;
  const cls = p >= 0.6 ? "hi" : p >= 0.35 ? "mid" : "low";
  return `<span class="pill ${cls}">${Math.round(p*100)}%</span>`;
}
function fmt(n) { return n == null ? "—" : n.toLocaleString(); }
function nav() {
  document.getElementById("tabs").innerHTML = TABS.map(([id,l]) =>
    `<button class="${id===cur?'on':''}" onclick="go('${id}')">${l}</button>`).join("");
}
function go(t) { cur = t; nav(); render(); }

function rowsTable(rows) {
  return `<div class="tw"><table><thead><tr>
    <th class="l">台</th><th class="l">機種</th><th>P(設定4+)</th><th>朝</th>
    <th>BIG</th><th>REG</th><th>G数</th><th>合成</th><th>本日推定</th><th>差枚</th>
  </tr></thead><tbody>
  ${rows.map(r => {
    const cls = r.p_latest >= 0.6 ? "hi" : r.p_latest >= 0.35 ? "mid" : "";
    return `<tr class="${cls}" onclick="unit('${r.cd_dai}')">
      <td class="l">${r.cd_dai}</td><td class="l">${r.kisyu.replace("ジャグラー","ジャグ")}</td>
      <td>${pill(r.p_latest)}</td><td>${pill(r.p_morning)}</td>
      <td>${fmt(r.big)}</td><td>${fmt(r.reg)}</td><td>${fmt(r.games)}</td>
      <td>${r.gousei ? "1/" + r.gousei : "—"}</td>
      <td>${r.p4_today != null ? "設定" + r.ml_setting + (r.reliable ? "" : "?") : "—"}</td>
      <td>${fmt(r.diff_medal)}</td></tr>`;
  }).join("")}</tbody></table></div>`;
}

const short = k => k.replace("ジャグラー","ジャグ").replace(/^スマスロ[\s　]*/,"").replace(/^Ｌ[\s　]*|^L[\s　]*/,"");
function kwCell(v) {
  const c = v >= 105 ? "pos" : v < 100 ? "neg" : "";
  return `<td class="kw ${c}">${v.toFixed(1)}%</td>`;
}
function diffCell(v) {
  return `<td class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${fmt(v)}</td>`;
}

function kisyuTable(list) {
  return `<div class="tw"><table><thead><tr>
    <th class="l">機種</th><th>台数</th><th>実測機械割</th><th>総差枚</th>
    <th>プラス台率</th><th>勝率</th><th>平均G</th></tr></thead><tbody>
    ${list.map(k => {
      // 数台しか無い機種は1台の大当たり/ハマりで機械割が振れるので参考扱いにする
      const thin = k.n_units < MIN_UNITS_FOCUS || k.unit_days < MIN_UNITDAYS_FOCUS;
      return `<tr${thin ? ' style="opacity:.55"' : ''}><td class="l">${short(k.kisyu)}${
        thin ? '<span class="tag">参考</span>' : ''}</td><td>${k.n_units}</td>
      ${kwCell(k.kikaiwari)}${diffCell(k.diff)}
      <td>${Math.round(k.plus_rate*100)}%</td><td>${Math.round(k.win_rate*100)}%</td>
      <td>${fmt(k.avg_games)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function unitTable(list) {
  return `<div class="tw"><table><thead><tr>
    <th class="l">台</th><th class="l">機種</th><th>累計差枚</th><th>機械割</th>
    <th>好調日</th><th>日数</th><th>平均G</th></tr></thead><tbody>
    ${list.map(u => `<tr onclick="unit('${u.cd_dai}')"><td class="l">${u.cd_dai}</td>
      <td class="l">${short(u.kisyu)}</td>${diffCell(u.diff)}${kwCell(u.kikaiwari)}
      <td>${u.plus}/${u.days}</td><td>${u.days}</td><td>${fmt(u.avg_games)}</td></tr>`).join("")}
    </tbody></table></div>`;
}

// 十分な母数がある機種だけで、フロア全体平均からの離れ具合を見る
const MIN_UNITS_FOCUS = 5, MIN_UNITDAYS_FOCUS = 20;
function focusCallout(F) {
  const elig = F.kisyu.filter(k => k.n_units >= MIN_UNITS_FOCUS && k.unit_days >= MIN_UNITDAYS_FOCUS);
  if (elig.length < 2) return "";
  const g = elig.reduce((a,k) => ({g:a.g+k.games, d:a.d+k.diff}), {g:0,d:0});
  const avg = (g.g*3+g.d)/(g.g*3)*100;
  const best = elig[0], worst = elig[elig.length-1];
  if (best.kikaiwari - worst.kikaiwari < 1.5) return "";
  return `<div class="card" style="margin:10px 0">
    <h3>直近の配分から見た狙い目</h3>
    <div style="line-height:1.8">
      本命 <b style="color:var(--accent)">${short(best.kisyu)}</b>
      <span class="kw">${best.kikaiwari.toFixed(1)}%</span>
      <span class="tag">${best.n_units}台 / プラス台率${Math.round(best.plus_rate*100)}%</span><br>
      回避 <b style="color:#c86e6e">${short(worst.kisyu)}</b>
      <span class="kw">${worst.kikaiwari.toFixed(1)}%</span>
      <span class="tag">${worst.n_units}台 / プラス台率${Math.round(worst.plus_rate*100)}%</span><br>
      <span style="color:var(--dim);font-size:11px">
        対象機種平均 ${avg.toFixed(1)}%（${MIN_UNITS_FOCUS}台以上・${MIN_UNITDAYS_FOCUS}台日以上の機種のみ）。
        現行配置${F.layout.full_days.length}営業日ぶんの実測にすぎないので、当日の実測が出たら
        「本日の候補」の追っかけを優先してください。</span>
    </div></div>`;
}

// 抽選番号が出てからの動き方。朝一は台別の根拠が無いので「機種を選ぶ」ことに絞る
function pickPlan(F) {
  const P = F.pick_order;
  if (!P || P.ranked.length < 3) return "";
  const seats = k => (F.floor_map.find(f => f.kisyu === k.kisyu) || {}).units || [];
  const jug = P.ranked.filter(k => k.kisyu.includes("ジャグラー"));
  const top = jug.length >= 3 ? jug : P.ranked;
  const avoid = P.ranked.filter(k => P.avoid.includes(k.kisyu));
  const line = (k, i) => `<div style="border-bottom:1px solid #232a33;padding:6px 0">
      <b style="color:var(--accent)">${i + 1}. ${short(k.kisyu)}</b>
      <span class="kw" style="float:right">${k.kikaiwari.toFixed(1)}%
        <span style="color:var(--dim);font-size:10px">(${k.ci_lo}〜${k.ci_hi})</span></span>
      <br><i style="color:var(--dim);font-size:11px">${k.n_units}台 ${seats(k).join(" ") || ""}</i>
    </div>`;
  return `<div class="card" style="margin:10px 0">
    <h3>抽選番号が出たら（朝一の動き方）</h3>
    <p class="note" style="margin:0 0 8px">
      朝一は当日データがゼロで、現行配置も${F.layout.full_days.length}営業日しかないため
      <b>台単位で狙う根拠はありません</b>。機種だけ選んでください。
      並びは点推定ではなく<b>95%信頼区間の下限</b>順です（少台数で跳ねた機種を上位に置かないため）。
    </p>
    ${top.slice(0, 5).map(line).join("")}
    ${avoid.length ? `<p class="note" style="margin:8px 0 0">
      <b style="color:#ff9b9b">避ける: ${avoid.map(k => short(k.kisyu)).join("・")}</b>
      — 信頼区間の上限が100%を下回っており、このデータ範囲では確からしくマイナスです。
      台数が多く最後まで空いていますが、空いているから座る対象ではありません。</p>` : ""}
    <p class="note" style="margin:8px 0 0">
      <b>番号が悪くて上位機種が埋まっていたら、朝一で無理に座らないでください。</b>
      当日実測が入る<b>13:45頃</b>にこのページの「本日の候補」タブを見れば、
      BIG/REG実績からの設定4+推定が出ます。そこから追っかける方が朝一の当てずっぽうより確実です。
      次の更新は19:45頃です。</p>
  </div>`;
}

const GRADE_COLOR = {"◎":"#7ee2a8","○":"#9ecbff","△":"#d8c98a","✕":"#c86e6e"};
const DOW = ["月","火","水","木","金","土","日"];

// その日どの機種が打てたか。前日の結果は翌日に伝播しないので朝の台選びには使えない
function dailyLog(F) {
  const L = F.daily_picks || [];
  if (!L.length) return `<p class="note">${F.picks_since} 以降の営業日がまだありません。</p>`;
  const row = p => `<div style="border-bottom:1px solid #232a33;padding:5px 0${p.thin ? ";opacity:.55" : ""}">
      <b style="color:${GRADE_COLOR[p.grade]}">${p.grade}</b>
      <b style="margin-left:6px">${short(p.kisyu)}</b>
      ${p.thin ? `<span class="tag">参考</span>` : ""}
      <span class="kw" style="float:right">${p.kikaiwari.toFixed(1)}%</span>
      <br><i style="color:var(--dim);font-size:11px">${p.n_units}台
        ／ プラス台率${Math.round(p.plus_rate*100)}%
        ${p.avg_setting != null ? `／ 推定設定${p.avg_setting.toFixed(2)}` : ""}
        ／ ${fmt(p.games)}G ${p.diff > 0 ? "+" : ""}${fmt(p.diff)}枚</i>
    </div>`;
  return L.map(d => `<div class="card" style="margin:10px 0">
      <h3>${d.biz_date.slice(5).replace("-","/")}（${DOW[d.dow]}）
        ${d.is_final ? "" : `<span class="tag new">途中経過</span>`}</h3>
      <p class="note" style="margin:0 0 6px">
        稼働 ${fmt(d.games_per_unit)}G/台
        ${d.avg_setting != null ? `／ ジャグラー推定平均設定 <b>${d.avg_setting.toFixed(2)}</b>` : ""}</p>
      ${d.picks.map(row).join("")}
    </div>`).join("");
}

function floorMap(F, filter) {
  const swapped = new Set(F.layout.moved.map(m => m.cd_dai));
  const list = filter ? F.floor_map.filter(filter) : F.floor_map;
  return `<div class="map">${list.map(f => {
    const n = f.units.filter(u => swapped.has(u)).length;
    return `<div><b>${short(f.kisyu)}</b> <i>${f.n}台</i>${
      n ? `<span class="tag new">${n}台が入替</span>` : ''}
      <br><i>${f.units.join(" ")}</i></div>`;
  }).join("")}</div>`;
}

function layoutWarning() {
  const L = D.floor.layout;
  if (!L.changed_on) return "";
  const n = L.full_days.length;
  return `<div class="warn">
    <b>${L.changed_on} から現在のラインナップで全面稼働しています。</b>
    同じ台番が別機種になった台は ${L.moved.length}台。
    台番ごとの「くせ」は機種が変わった時点でリセットしています。<br>
    <b>現行配置での営業実績は${n}営業日（${L.full_days[0]}〜${L.full_days[n-1]}）しかありません。</b>
    朝の事前予測はほぼ効かないので、<b>当日実測の追っかけを主軸に</b>してください。<br>
    <span style="color:var(--dim)">※ 台の増減は出していません。7/28以前は機種一覧ページ経由で収集しており
    フロアの一部しか取れていなかったため、当時のデータと台数を比較できないためです。</span>
  </div>`;
}

function render() {
  const m = document.getElementById("main");
  if (!D) { m.innerHTML = "<p class='note'>読み込み中…</p>"; return; }
  if (cur === "daily") {
    const F = D.floor;
    const jug = D.rows.filter(r => r.p_latest != null).slice(0, 10);
    const topUnits = F.units.slice(0, 15);
    // 営業前はprediction側の日付が先行してdaily_picksに当日分がまだ無い。
    // 前日の数字を当日として出すと追っかけの判断を誤るので日付一致を要求する
    const today = (F.daily_picks || []).find(d => d.biz_date === D.biz_date);
    const td = new Date(D.biz_date + "T00:00:00");
    m.innerHTML = `
      <div class="hero">
        <div class="d">${D.biz_date.slice(5).replace("-","/")}（${DOW[(td.getDay()+6)%7]}）${
          today && !today.is_final ? " 途中経過" : ""}</div>
        <div class="t">${today ? `稼働 ${fmt(today.games_per_unit)}G/台${
            today.avg_setting != null ? ` ｜ ジャグラー推定平均設定 ${today.avg_setting.toFixed(2)}` : ""}` : "当日データ待ち"}｜
          直近${F.window_days.length}営業日 ${F.window_days[F.window_days.length-1]}〜${F.window_days[0]} の実績で作成<br>
          ${F.layout.changed_on ? `うち現行フロア全機種が揃っているのは ${F.layout.changed_on} 以降の${F.layout.full_days.length}営業日` : ""}</div>
      </div>
      ${layoutWarning()}
      ${pickPlan(F)}
      ${focusCallout(F)}

      <h2 class="sec">機種別の配分（直近${F.window_days.length}営業日）</h2>
      <p class="note">実測機械割はIN=3枚/G近似。${F.min_games_unitday}G未満の台日は除外。
        プラス台率＝機械割${Math.round(F.plus_kikaiwari*100)}%以上だった台日の割合。
        店がどの機種にプラスを置いているかを見る指標です。
        ここでは<b>${MIN_UNITS_FOCUS}台以上</b>の機種のみ表示しています
        （少台数の機種は1台の引きで機械割が振れるため）。
        全${F.kisyu.length}機種は「機種横断」タブへ。</p>
      ${kisyuTable(F.kisyu.filter(k => k.n_units >= MIN_UNITS_FOCUS))}

      <h2 class="sec">ジャグラー 設定4+候補</h2>
      <p class="note">BIG/REG回数からの設定ベイズ推定。ジャグラーのみスペック表があるので算出できます。</p>
      ${jug.length ? rowsTable(jug) : `<p class="note">当日データ待ちです。</p>`}

      <h2 class="sec">全機種 好調台（累計差枚 上位）</h2>
      <p class="note">AT機は設定推定ができないため、差枚と機械割の実測で並べています。</p>
      ${unitTable(topUnits)}

      <h2 class="sec">日別 打てる機種（${F.picks_since} 以降）</h2>
      <p class="note">その日の実測機械割で ◎105%以上 / ○100%以上 / △97%以上 / ✕それ未満。
        ${F.min_games_unitday}G未満の台日は除外、現行フロアに無い機種は出していません。
        <b>${F.min_units_pick}台未満の機種は「参考」</b>（1台の引きで機械割が振れるため）。<br>
        <b>これは事後の実測なので、翌日の台選びには使えません。</b>
        同一台の前日→翌日の差枚相関はほぼゼロ（r=-0.01, n=2,259台日）で、
        「昨日出ていたから今日も」は成立しませんでした。用途は<b>当日の追っかけ</b>と振り返りです。</p>
      ${dailyLog(F)}

      <h2 class="sec">ジャグラーの配置</h2>
      <p class="note">設定推定ができるのはジャグラーだけです。全${F.floor_map.reduce((a,f)=>a+f.n,0)}台
        ${F.floor_map.length}機種の配置は「機種横断」タブへ。</p>
      ${floorMap(F, f => f.kisyu.includes("ジャグラー"))}`;
  } else if (cur === "cross") {
    const F = D.floor;
    const tot = F.kisyu.reduce((a,k) => ({g:a.g+k.games, d:a.d+k.diff}), {g:0,d:0});
    m.innerHTML = `
      <div class="kpi">
        <div><span>対象機種</span><b>${F.kisyu.length}</b></div>
        <div><span>対象台数</span><b>${F.kisyu.reduce((a,k)=>a+k.n_units,0)}</b></div>
        <div><span>総差枚</span><b class="${tot.d>0?'pos':'neg'}">${fmt(tot.d)}</b></div>
        <div><span>全体機械割</span><b>${(((tot.g*3+tot.d)/(tot.g*3))*100).toFixed(1)}%</b></div>
      </div>
      <p class="note">直近${F.window_days.length}営業日（${F.window_days[F.window_days.length-1]}〜${F.window_days[0]}）。
        ${F.min_games_unitday}G未満の台日は除外。</p>
      <h2 class="sec">機種別（全${F.kisyu.length}機種）</h2>
      <p class="note"><b>「参考」は${MIN_UNITS_FOCUS}台未満または${MIN_UNITDAYS_FOCUS}台日未満</b>で、
        1台の引きで機械割が大きく振れるため狙い目の根拠にはできません。</p>
      ${kisyuTable(F.kisyu)}
      <h2 class="sec">台別（全機種・累計差枚順）</h2>
      ${unitTable(F.units)}
      <h2 class="sec">現在の配置（${F.floor_map.reduce((a,f)=>a+f.n,0)}台 / ${F.floor_map.length}機種）</h2>
      ${floorMap(F)}`;
  } else if (cur === "today") {
    const rows = D.rows.filter(r => r.p_latest != null).slice(0, 15);
    m.innerHTML = `<p class="note">P(設定4+)=機械割100%超の見込み、上位15台。朝=台くせによる弱い参考値、日中の収集(12:30/18:30)後は当日実測ベースの「追っかけ」予測。</p>`
      + rowsTable(rows);
  } else if (cur === "all") {
    m.innerHTML = rowsTable(D.rows);
  } else if (cur === "trends") {
    const t = D.trends, dows = ["月","火","水","木","金","土","日"];
    const bar = (l,p) => `<div>${l} <span style="float:right">${Math.round(p*100)}%</span></div>
      <div class="bar"><i style="width:${Math.min(p*200,100)}%"></i></div>`;
    const tu = Object.entries(t.unit||{}).sort((a,b)=>b[1]-a[1]).slice(0,10);
    m.innerHTML = `<p class="note">設定4+投入率（平滑化済み、全体${Math.round(t.base*100)}%、確定台日数${t.n_days}）。観測用の参考値です（現状、日をまたぐ規則性は予測に使っていません）。</p>
      <div class="grid">
        <div class="card"><h3>曜日別</h3>${dows.map((n,i)=>t.dow&&t.dow[i]!=null?bar(n,t.dow[i]):"").join("")}</div>
        <div class="card"><h3>日付特徴</h3>
          ${t.event8&&t.event8.true!=null?bar("旧イベ日(8日)",t.event8.true):""}
          ${t.event8&&t.event8.false!=null?bar("通常日",t.event8.false):""}
          ${t.day18_28&&t.day18_28.true!=null?bar("18・28日",t.day18_28.true):""}
          ${t.zorome&&t.zorome.true!=null?bar("ゾロ目",t.zorome.true):""}
          ${bar("据え置き率",t.carryover)}</div>
        <div class="card"><h3>機種別</h3>${Object.entries(t.kisyu||{}).map(([k,p])=>bar(k.replace("ジャグラー","ジャグ"),p)).join("")}</div>
        <div class="card"><h3>台番号別TOP10</h3>${tu.map(([k,p])=>bar(k,p)).join("")}</div>
      </div>`;
  } else if (cur === "accuracy") {
    const PH = {morning:"朝", intraday:"追っかけ"};
    m.innerHTML = D.accuracy.length === 0
      ? `<p class="note">まだ採点された予測がありません。夜の確定処理後に表示されます。</p>`
      : `<p class="note">的=設定4以上（機械割100%超）。AUC=順位付けの質（0.5=偶然、1.0=完全）。</p>
         <div class="tw"><table><thead><tr><th class="l">営業日</th><th class="l">予測</th><th>Top3的中</th><th>AUC</th><th>実4+台数</th><th>採点台数</th></tr></thead>
         <tbody>${D.accuracy.map(r => `<tr><td class="l">${r.biz_date}</td>
           <td class="l">${PH[r.phase]||r.phase}</td>
           <td>${r.top3_hits}/${r.top3_n}</td>
           <td>${r.auc!=null?r.auc.toFixed(2):"—"}</td>
           <td>${r.n_high_actual}</td><td>${r.n_scored}</td></tr>`).join("")}</tbody></table></div>`;
  }
}

function unit(dai) {
  const m = document.getElementById("main");
  const hist = D.history[dai] || [];
  const pts = D.slump[dai];
  let graph = "";
  if (pts && pts.length > 1) {
    const min = Math.min(...pts, 0), max = Math.max(...pts, 1);
    const x = i => (i/(pts.length-1)*100).toFixed(1);
    const y = v => (100-(v-min)/(max-min)*100).toFixed(1);
    graph = `<div class="card"><h3>${D.biz_date} 差枚 (${pts[pts.length-1]})</h3>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none">
      <polyline fill="none" stroke="#e8b03c" stroke-width="1.5" points="${pts.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>
      <line x1="0" x2="100" y1="${y(0)}" y2="${y(0)}" stroke="#3a4453" stroke-width="0.5"/></svg></div>`;
  }
  m.innerHTML = `<span class="back" onclick="go(cur)">← 戻る</span>
    <h2 id="detail">台番 ${dai}（${hist[0] ? hist[0].kisyu || "" : ""}）</h2>${graph}
    <div class="tw"><table><thead><tr><th class="l">日付</th><th>BIG</th><th>REG</th><th>G数</th><th>差枚</th><th>機械割</th><th>推定</th><th>P(4+)</th></tr></thead>
    <tbody>${hist.map(h => `<tr>
      <td class="l">${h.biz_date}${h.is_final ? "" : " *"}</td><td>${fmt(h.big)}</td><td>${fmt(h.reg)}</td>
      <td>${fmt(h.games)}</td><td>${fmt(h.diff_medal)}</td><td>${h.kikaiwari}%</td>
      <td>${h.ml_setting ? "設定" + h.ml_setting : "—"}</td><td>${pill(h.p4)}</td></tr>`).join("")}</tbody></table></div>`;
}

nav(); render();
fetch("data.json?t=" + Date.now()).then(r => r.json()).then(d => {
  D = d;
  document.getElementById("meta").textContent = `営業日 ${d.biz_date} ｜ 更新 ${d.generated_at.replace("T"," ")}`;
  render();
});
</script>
</body>
</html>
